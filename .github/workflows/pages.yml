name: Deploy web client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install web client dependencies
        run: pnpm install --frozen-lockfile --filter "@nightpaws/web..."

      - name: Build web client for /nightpaws/
        run: pnpm --filter @nightpaws/web build --base=/nightpaws/

      - name: Disable Jekyll processing
        run: touch apps/web/dist/.nojekyll

      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
